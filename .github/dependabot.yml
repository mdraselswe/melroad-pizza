# Weekly update PRs; CI must pass before merging. Minor/patch npm updates are grouped into one PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Held back until peers support them; see docs/adr/0006-toolchain-versions.md.
    ignore:
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: eslint
        versions: [">=10"]
      - dependency-name: "@types/node"
        versions: [">=25"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
