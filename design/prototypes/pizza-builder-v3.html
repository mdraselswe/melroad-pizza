<title>Melroad Ember</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Instrument+Serif:ital@1&display=swap">
<style>
/* Layout: "Ember" — oven-glow horizon hero, deals marquee + bento, glass build-your-pizza studio.
   Neutral warm base, one living ember gradient, glass surfaces, grain. */
@property --beam { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
:root {
  --bg: #faf7f3;
  --bg-2: #f2ede6;
  --glass: rgba(255, 255, 255, .72);
  --glass-border: rgba(40, 20, 8, .09);
  --text: #1b1410;
  --muted: #6d625a;
  --faint: rgba(27, 20, 16, .06);
  --ember-1: #ff7a1a;
  --ember-2: #f2361f;
  --ember-3: #ffb23f;
  --accent: #e8431c;
  --on-accent: #fff;
  --glow: rgba(255, 106, 26, .28);
  --glow-2: rgba(242, 54, 31, .18);
  --horizon-core: #faf7f3;
  --board: #c9915a;
  --board-edge: #a06b3a;
  --shadow: rgba(80, 36, 10, .22);
  --grain-opacity: .035;
  --ring: rgba(120, 50, 10, .1);
  --solid: #fffdf9;
  --font: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  --radius: 22px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0807; --bg-2: #120e0c; --glass: rgba(255, 255, 255, .045); --glass-border: rgba(255, 255, 255, .09);
    --text: #f7f2ec; --muted: #a49a92; --faint: rgba(255, 255, 255, .06); --accent: #ff5a1f; --on-accent: #fff;
    --glow: rgba(255, 106, 26, .42); --glow-2: rgba(242, 54, 31, .3); --horizon-core: #0a0807;
    --board: #6b4527; --board-edge: #4a2d17; --shadow: rgba(0, 0, 0, .6); --grain-opacity: .05;
    --ring: rgba(255, 150, 90, .12); --solid: #17110e; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0807; --bg-2: #120e0c; --glass: rgba(255, 255, 255, .045); --glass-border: rgba(255, 255, 255, .09);
  --text: #f7f2ec; --muted: #a49a92; --faint: rgba(255, 255, 255, .06); --accent: #ff5a1f; --on-accent: #fff;
  --glow: rgba(255, 106, 26, .42); --glow-2: rgba(242, 54, 31, .3); --horizon-core: #0a0807;
  --board: #6b4527; --board-edge: #4a2d17; --shadow: rgba(0, 0, 0, .6); --grain-opacity: .05;
    --ring: rgba(255, 150, 90, .12); --solid: #17110e; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
html { scroll-behavior: smooth; }
body { font-family: var(--font); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background-color .4s, color .4s; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
button, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.grain {
  position: fixed; inset: 0; z-index: 70; pointer-events: none; opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
.ember-text {
  background: linear-gradient(100deg, var(--ember-3), var(--ember-1) 30%, var(--ember-2) 60%, var(--ember-3));
  background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: ember-pan 6s ease-in-out infinite alternate;
}
@keyframes ember-pan { to { background-position: 100% 0; } }

/* ---------- floating nav ---------- */
.nav {
  position: fixed; z-index: 50; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%);
  width: min(1180px, calc(100% - 24px)); display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px;
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 999px;
  backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 10px 40px -20px var(--shadow); animation: nav-in .8s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes nav-in { from { transform: translate(-50%, -30px); opacity: 0; } }
.logo { display: flex; align-items: center; gap: 9px; text-decoration: none; color: inherit; font-weight: 800; letter-spacing: -.02em; font-size: 18px; }
.logo-mark { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(from 200deg, var(--ember-3), var(--ember-1), var(--ember-2), var(--ember-3)); display: grid; place-items: center; box-shadow: 0 0 18px var(--glow); }
.logo-mark::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); }
.nav-links { display: flex; gap: 2px; margin-left: 16px; }
.nav-links a { color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 12px; border-radius: 999px; transition: color .2s, background-color .2s; }
.nav-links a:hover { color: var(--text); background: var(--faint); }
.nav-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.icon-btn, .lang { height: 38px; border-radius: 999px; border: 1px solid var(--glass-border); background: transparent; }
.icon-btn { width: 38px; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.lang { appearance: none; padding: 0 12px; font-size: 13px; font-weight: 600; }
.cart-btn { height: 38px; display: inline-flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; border-radius: 999px; border: 0; background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px; }
.cart-btn svg { width: 17px; height: 17px; }
.cart-count { min-width: 26px; height: 26px; border-radius: 999px; display: inline-grid; place-items: center; padding: 0 7px; font-size: 12.5px; font-weight: 700; background: linear-gradient(135deg, var(--ember-1), var(--ember-2)); color: #fff; font-variant-numeric: tabular-nums; }
.cart-btn.bump { animation: bump .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes bump { 40% { transform: scale(1.12); } }

/* ---------- hero ---------- */
.hero { position: relative; overflow: hidden; padding-top: calc(env(safe-area-inset-top, 0px) + 120px); padding-bottom: 40px; isolation: isolate; }
.aurora { position: absolute; inset: 0; z-index: -2; pointer-events: none; }
.aurora i { position: absolute; border-radius: 50%; }
.aurora i:nth-child(1) { width: 820px; height: 820px; right: -8%; top: -6%; background: radial-gradient(closest-side, var(--glow), transparent); }
.aurora i:nth-child(2) { width: 640px; height: 640px; right: 20%; top: 26%; background: radial-gradient(closest-side, var(--glow-2), transparent); }
.aurora i:nth-child(3) { width: 600px; height: 600px; left: -16%; top: -24%; background: radial-gradient(closest-side, var(--glow-2), transparent); opacity: .5; }
.dots { position: absolute; inset: 0; z-index: -1; pointer-events: none; background-image: radial-gradient(var(--faint) 1.2px, transparent 1.2px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 70%); mask-image: radial-gradient(ellipse at 70% 40%, #000 20%, transparent 70%); }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.02fr) minmax(0, 1fr); gap: 32px; align-items: center; }
.hero-copy { min-width: 0; }
.badge {
  display: inline-flex; align-items: center; gap: 10px; padding: 6px 14px 6px 8px; border-radius: 999px; font-size: 13.5px; font-weight: 500;
  background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(10px); position: relative; overflow: hidden;
  animation: rise .8s .15s cubic-bezier(.2,.8,.2,1) both;
}
.badge::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%); transform: translateX(-100%); animation: sheen 3.6s 1.2s ease-in-out infinite; }
@keyframes sheen { 60%, 100% { transform: translateX(100%); } }
.badge .dot { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(52, 168, 83, .16); }
.badge .dot::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #34a853; box-shadow: 0 0 0 0 rgba(52,168,83,.6); animation: ping 2s infinite; }
.badge[data-open="false"] .dot { background: var(--faint); }
.badge[data-open="false"] .dot::after { background: var(--muted); animation: none; }
@keyframes ping { 70% { box-shadow: 0 0 0 7px rgba(52,168,83,0); } }
h1.headline { font-size: clamp(44px, 6.4vw, 84px); line-height: .98; letter-spacing: -.045em; font-weight: 700; margin: 22px 0 0; text-wrap: balance; }
.headline .w { display: inline-block; animation: blur-in .9s cubic-bezier(.2,.8,.2,1) both; }
.headline .serif { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -.02em; padding-right: .06em; }
@keyframes blur-in { from { opacity: 0; filter: blur(12px); transform: translateY(18px); } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.lede { font-size: 18px; color: var(--muted); max-width: 46ch; margin: 22px 0 0; animation: rise .9s .7s cubic-bezier(.2,.8,.2,1) both; text-wrap: pretty; }
.cta-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 30px; animation: rise .9s .85s cubic-bezier(.2,.8,.2,1) both; }
.btn-shimmer {
  position: relative; overflow: hidden; border: 0; border-radius: 999px; padding: 15px 26px; font-weight: 600; font-size: 16px; color: #fff; text-decoration: none;
  background: linear-gradient(135deg, var(--ember-1), var(--ember-2)); box-shadow: 0 0 0 1px rgba(255,255,255,.14) inset, 0 14px 40px -12px var(--ember-2);
  display: inline-flex; align-items: center; gap: 10px; transition: transform .2s, box-shadow .2s;
}
.btn-shimmer::before { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%); transform: translateX(-100%); animation: sheen 3s ease-in-out infinite; }
.btn-shimmer:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(255,255,255,.2) inset, 0 20px 50px -12px var(--ember-2); }
.btn-shimmer svg { width: 18px; height: 18px; transition: transform .25s; }
.btn-shimmer:hover svg { transform: translateX(3px); }
.btn-ghost { border-radius: 999px; padding: 15px 24px; font-weight: 600; font-size: 16px; color: var(--text); text-decoration: none; border: 1px solid var(--glass-border); background: var(--glass); backdrop-filter: blur(10px); transition: background-color .2s; }
.btn-ghost:hover { background: var(--faint); }
.stats { display: flex; flex-wrap: wrap; gap: 28px; margin-top: 44px; animation: rise .9s 1s cubic-bezier(.2,.8,.2,1) both; }
.stat b { display: block; font-size: 30px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13.5px; color: var(--muted); }

.hero-stage { position: relative; aspect-ratio: 1; width: 100%; max-width: 560px; justify-self: center; --mx: 0; --my: 0; }
.horizon {
  position: absolute; left: 50%; top: 58%; width: 150%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; z-index: -1;
  background:
    radial-gradient(ellipse 55% 26% at 50% 0%, var(--glow), transparent 70%),
    radial-gradient(closest-side, var(--horizon-core) 92%, transparent 100%);
  box-shadow: 0 -2px 0 0 rgba(255, 200, 140, .9), 0 -18px 60px 6px var(--ember-1), 0 -60px 140px 30px var(--glow);
  animation: horizon-in 1.6s .2s cubic-bezier(.2,.8,.2,1) both;
}
.horizon::before {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-radial-gradient(circle at 50% 50%, transparent 0 26px, var(--ring) 26px 27px);
  -webkit-mask-image: linear-gradient(#000 0%, transparent 34%); mask-image: linear-gradient(#000 0%, transparent 34%);
}
.horizon::after {
  content: ""; position: absolute; inset: 0; border-radius: 50%;
  background: repeating-conic-gradient(from 0deg at 50% 50%, var(--ring) 0 .25deg, transparent .25deg 6deg);
  -webkit-mask-image: linear-gradient(#000 0%, transparent 22%); mask-image: linear-gradient(#000 0%, transparent 22%);
}
@keyframes horizon-in { from { opacity: 0; transform: translate(-50%, 40px); } }
#embers { position: absolute; inset: -10% -10% 0; width: 120%; height: 110%; z-index: 0; pointer-events: none; }
.parallax { position: absolute; inset: 8%; z-index: 1; will-change: transform; }
.hero-pizza-wrap { position: absolute; inset: 0; }
.hero-pizza-wrap.ready { animation: pizza-in 1.3s cubic-bezier(.2,.9,.25,1.1) both; }
@keyframes pizza-in { from { opacity: 0; transform: scale(.7) rotate(-40deg); } }
.pizza-shadow { position: absolute; left: 4%; right: 4%; top: 16%; bottom: -8%; border-radius: 50%; background: radial-gradient(closest-side, var(--shadow), transparent); }
.hero-pizza { position: absolute; inset: 0; animation: spin 90s linear infinite; will-change: transform; }
.hero-pizza img, .orbit img, .layer img { display: block; width: 100%; height: 100%; }
.layer svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.sheen-overlay { position: absolute; inset: 1%; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at 32% 26%, rgba(255,255,255,.22), transparent 42%, transparent 70%, rgba(30,8,0,.3)); }
.ring-text { position: absolute; inset: -11%; animation: spin 70s linear infinite reverse; will-change: transform; pointer-events: none; }
.ring-text svg { width: 100%; height: 100%; overflow: visible; }
.ring-text text { font-family: var(--font); font-size: 6.4px; font-weight: 600; letter-spacing: .3em; fill: var(--muted); }
.ring-text circle { fill: none; stroke: var(--ring); stroke-width: .6; }
.ring-text circle.dash { stroke-dasharray: 1 3; stroke: var(--accent); opacity: .5; }
@keyframes spin { to { transform: rotate(360deg); } }
.orbit { position: absolute; z-index: 2; width: 17%; aspect-ratio: 1; will-change: transform; }
.orbit img { animation: bob 6s ease-in-out infinite; }
.orbit:nth-child(odd) img { animation-duration: 7.5s; animation-direction: reverse; }
@keyframes bob { 50% { transform: translateY(-14px) rotate(10deg); } }
.price-tag {
  position: absolute; z-index: 3; right: 2%; bottom: 14%; padding: 12px 16px; border-radius: 18px; background: var(--solid); border: 1px solid var(--glass-border);
  box-shadow: 0 18px 40px -20px var(--shadow); animation: rise .9s 1.4s cubic-bezier(.2,.8,.2,1) both;
}
.price-tag small { display: block; font-size: 12.5px; color: var(--muted); }
.price-tag b { font-size: 22px; letter-spacing: -.02em; }

/* ---------- marquee ---------- */
.marquee { border-block: 1px solid var(--glass-border); padding-block: 18px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.marquee-track { display: flex; gap: 48px; width: max-content; animation: marquee 40s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-item { display: inline-flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
.marquee-item em { font-family: var(--font-serif); font-weight: 400; font-size: 22px; color: var(--accent); }
.marquee-item i { width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(135deg, var(--ember-1), var(--ember-2)); }
@keyframes marquee { to { transform: translateX(-50%); } }

/* ---------- sections ---------- */
section.block { padding-block: 96px; position: relative; }
.section-head { display: grid; gap: 12px; max-width: 640px; margin-bottom: 40px; }
.kicker { font-size: 13px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
h2 { font-size: clamp(34px, 4.4vw, 56px); line-height: 1.02; letter-spacing: -.04em; font-weight: 700; margin: 0; text-wrap: balance; }
h2 .serif { font-family: var(--font-serif); font-style: italic; font-weight: 400; letter-spacing: -.01em; }
.section-head p { margin: 0; color: var(--muted); font-size: 17px; }

/* bento deals */
.bento { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: minmax(200px, auto); gap: 16px; }
.card {
  position: relative; border-radius: var(--radius); padding: 26px; background: var(--glass); border: 1px solid var(--glass-border);
  overflow: hidden; display: flex; flex-direction: column; gap: 8px; min-width: 0; isolation: isolate;
  --sx: 50%; --sy: 50%;
}
.card::before { content: ""; position: absolute; inset: 0; z-index: -1; opacity: 0; transition: opacity .3s; background: radial-gradient(420px circle at var(--sx) var(--sy), var(--glow), transparent 45%); }
.card:hover::before { opacity: 1; }
.card.featured { grid-column: span 2; grid-row: span 2; }
.card .deal-name { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.card h3 { margin: 0; font-size: 24px; letter-spacing: -.03em; line-height: 1.15; font-weight: 700; }
.card.featured h3 { font-size: clamp(30px, 3.4vw, 46px); max-width: 14ch; }
.card .price { margin-top: auto; display: flex; align-items: baseline; gap: 10px; }
.card .price b { font-size: 36px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
.card.featured .price b { font-size: 64px; }
.card .price span { color: var(--muted); font-size: 14px; }
.stack { position: absolute; right: -10px; bottom: -40px; width: 420px; height: 330px; z-index: -1; pointer-events: none; transform-origin: 100% 100%; }
.stack img { position: absolute; left: 0; top: 0; width: 230px; height: 230px; filter: drop-shadow(0 16px 18px var(--shadow));
  transform: translate(var(--x), var(--y)) rotate(var(--r)); transition: transform .7s cubic-bezier(.3,1.3,.5,1); }
.stack img:not([src]) { visibility: hidden; }
.card:hover .stack img { transform: translate(calc(var(--x) * 1.08 + var(--fx)), calc(var(--y) * 1.08 + var(--fy))) rotate(calc(var(--r) * 1.8)); }
.beam::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1.5px; pointer-events: none;
  background: conic-gradient(from var(--beam), transparent 0 68%, var(--ember-3) 78%, var(--ember-2) 88%, transparent 96%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: beam 5s linear infinite;
}
@keyframes beam { to { --beam: 360deg; } }

/* ---------- studio (builder) ---------- */
.studio { display: grid; grid-template-columns: 230px minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
.menu-list { display: flex; flex-direction: column; gap: 4px; }
.menu-item { text-align: left; background: none; border: 1px solid transparent; padding: 11px 14px; border-radius: 16px; color: var(--muted); display: grid; gap: 2px; transition: color .25s, background-color .25s, border-color .25s; }
.menu-item strong { font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
.menu-item small { font-size: 13.5px; line-height: 1.45; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .4s, opacity .4s; }
.menu-item:hover { color: var(--text); }
.menu-item[aria-pressed="true"] { color: var(--text); background: var(--glass); border-color: var(--glass-border); }
.menu-item[aria-pressed="true"] strong::after { content: ""; display: inline-block; width: 7px; height: 7px; margin-left: 8px; border-radius: 50%; background: linear-gradient(135deg, var(--ember-1), var(--ember-2)); vertical-align: middle; box-shadow: 0 0 10px var(--ember-1); }
.menu-item[aria-pressed="true"] small { max-height: 90px; opacity: 1; color: var(--muted); }
.build-stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 18px; min-width: 0; }
.build-stage::before { content: ""; position: absolute; left: 50%; top: 2%; width: 90%; aspect-ratio: 1; transform: translateX(-50%); border-radius: 50%; background: radial-gradient(closest-side, var(--glow), transparent 70%); filter: blur(20px); pointer-events: none; }
.plate { position: relative; width: min(540px, 100%); aspect-ratio: 1; }
.layer { position: absolute; inset: 0; }
.scaler { position: absolute; inset: 0; transition: transform .7s cubic-bezier(.3,1.35,.45,1); will-change: transform; }
.builder-title { text-align: center; position: relative; }
.builder-title h3 { margin: 0; font-size: clamp(36px, 4.6vw, 58px); letter-spacing: -.045em; line-height: 1; font-weight: 700; text-wrap: balance; }
.builder-title h3 em { font-family: var(--font-serif); font-weight: 400; }
.builder-title p { margin: 10px auto 0; color: var(--muted); max-width: 46ch; font-size: 15.5px; text-wrap: pretty; }
.board-fill { fill: var(--board); }
.board-edge { stroke: var(--board-edge); }
.wood-flood { flood-color: var(--board); }
.steam path { fill: none; stroke: rgba(255, 245, 230, .28); stroke-width: 6; stroke-linecap: round; animation: steam 4.5s ease-in-out infinite; opacity: 0; }
.steam path:nth-child(2) { animation-delay: 1.5s; }
.steam path:nth-child(3) { animation-delay: 3s; }
@keyframes steam { 0% { transform: translateY(20px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }

.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 92px); border-radius: 26px; padding: 22px; background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); display: flex; flex-direction: column; gap: 20px; min-width: 0; box-shadow: 0 30px 60px -40px var(--shadow); }
.group { display: flex; flex-direction: column; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }

  /* pointer parallax: one rAF loop writing transforms only, eased toward the cursor */
  function parallax() {

    let tx = 0, ty = 0, x = 0, y = 0, raf = 0;
    const loop = () => {
      x += (tx - x) * .08;
      y += (ty - y) * .08;
      for (const [el, d] of layers) el.style.transform = `translate3d(${(x * d).toFixed(2)}px, ${(y * d).toFixed(2)}px, 0)`;
      raf = Math.abs(tx - x) + Math.abs(ty - y) > .0015 ? requestAnimationFrame(loop) : 0;

    addEventListener("pointermove", (e) => {

      const c = document.createElement("canvas");
      c.width = c.height = 32;
      const g = c.getContext("2d"), grad = g.createRadialGradient(16, 16, 0, 16, 16, 16);
